// buildscript：MixinGradle（refmap 生成）
buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // NeoForge 1.21.1 开发插件（NeoGradle 7，与 NetMusic 1.21 分支同款）
    id 'net.neoforged.gradle.userdev' version '7.0.184'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 源码包（sources jar）：只打包 .java 源码，供开发者阅读/调试
tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}
// build 时一并产出 sources jar
tasks.named('assemble') {
    dependsOn 'sourcesJar'
}

// 运行部分（NeoGradle 7 风格）
runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

dependencies {
    // NeoForge 1.21.1 (JDK 21)
    implementation "net.neoforged:neoforge:${neo_version}"

    // 前置模组 Net Music：Modrinth Maven 引入（NeoForge 版 artifact，无需 fg.deobf）
    // 版本见 gradle.properties 的 netmusic_version（1.5.1-neoforge+mc1.21.1）
    implementation "maven.modrinth:net-music:${netmusic_version}-neoforge+mc${minecraft_version}"

    // Mixin 注解处理器（生成 refmap，运行时不打包）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 展开 gradle.properties 模板变量到 neoforge.mods.toml / pack.mcmeta
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version         : neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,
                             netmusic_version_range: netmusic_version_range]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
