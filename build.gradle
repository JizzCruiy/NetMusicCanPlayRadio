// 注意：不用 MixinGradle 插件 —— 它与 ForgeGradle 深度绑定（访问 reobf/createMcpToSrg），
// 在 NeoGradle 7 下会报 "unknown property 'reobf'"。
// 本 mod 的 mixin 全部 remap=false（目标是 NetMusic 的公共类，不参与 MC 混淆），
// refmap 实际为空映射，直接以静态空文件放于 resources（见 netmusiccanplayradio.refmap.json），
// 无需注解处理器生成。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // NeoForge 1.21.1 开发插件（NeoGradle 7，与 NetMusic 1.21 分支同款）
    id 'net.neoforged.gradle.userdev' version '7.0.184'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 源码包（sources jar）：只打包 .java 源码，供开发者阅读/调试
tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}
// build 时一并产出 sources jar
tasks.named('assemble') {
    dependsOn 'sourcesJar'
}

// 运行部分（NeoGradle 7 风格）
runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }
}

// Mixin 的 refmap 为静态空文件（resources 下），无需注解处理器生成
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

dependencies {
    // NeoForge 1.21.1 (JDK 21)
    implementation "net.neoforged:neoforge:${neo_version}"

    // 前置模组 Net Music：Modrinth Maven 引入（NeoForge 版 artifact，无需 fg.deobf）
    // 版本见 gradle.properties 的 netmusic_version（1.5.1-neoforge+mc1.21.1）
    implementation "maven.modrinth:net-music:${netmusic_version}-neoforge+mc${minecraft_version}"

    // Mixin：编译期注解 API（NeoForge 运行时自带 mixin，故 compileOnly 即可）
    compileOnly 'org.spongepowered:mixin:0.8.7'
    // Mixin 注解处理器（生成 refmap；版本与 NeoForge 1.21.1 内置的 mixin 一致）
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

// 展开 gradle.properties 模板变量到 neoforge.mods.toml / pack.mcmeta
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version         : neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,
                             netmusic_version_range: netmusic_version_range]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
