# Minecraft NeoForge 1.21.1 附属模组：NetMusicCanPlayRadio
# 依赖：Net Music (网络音乐机) 1.5.1+

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# 本机默认 Java 25 与 Gradle / NeoGradle 不兼容，强制用 JDK 21 运行 Gradle
org.gradle.java.home=C:/Program Files/Java/jdk-21

minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.2)
neo_version=21.1.219
neo_version_range=[21,)
loader_version_range=[4,)

# Parchment 映射（NeoGradle 7 子系统，无需 librarian 插件）
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

mod_id=netmusiccanplayradio
mod_name=NetMusicCanPlayRadio
mod_license=MIT
mod_version=0.2.0-neoforge+mc1.21.1
mod_group_id=com.github.netmusiccanplayradio
mod_authors=JiltCruiy
mod_description=Net Music addon: play Icecast/Shoutcast live radio streams and .pls/.m3u playlists on the Big Megaphone.

# 前置模组版本区间（Net Music 1.5.1+）
netmusic_version_range=[1.5.1,)
netmusic_version=1.5.1
